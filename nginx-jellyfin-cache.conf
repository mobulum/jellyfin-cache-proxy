# Jellyfin Caching Reverse Proxy Configuration for Nginx
# Optimized for high latency origins, massive playlists (5,000+ tracks),
# DLNA / UPnP streamers (WiiM Ultra, Yamaha MusicCast, etc.), and clients like Feishin / Finamp.
#
# Default Ports:
#   Frontend (clients / reverse proxy): 80, 8096
#   Backend Origin (Jellyfin): 127.0.0.1:8095

proxy_cache_path /var/cache/nginx/jellyfin
    levels=1:2
    keys_zone=jellyfin_cache:50m
    max_size=2g
    inactive=24h
    use_temp_path=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

log_format cachelog '$time_iso8601 client=$remote_addr cache=$upstream_cache_status status=$status rt=$request_time "$request_uri" action="$http_soapaction"';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8096;
    listen [::]:8096;
    server_name _;
    access_log /var/log/nginx/cache.log cachelog;

    proxy_buffering on;
    proxy_buffers 64 16k;
    proxy_busy_buffers_size 256k;
    proxy_max_temp_file_size 1024m;

    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_ignore_client_abort on;

    client_max_body_size 0;

    # === Endpoint 1: /playlists/{id}/items (Feishin / Jellyfin Web) ===
    location ~* ^/playlists/(?<pl_id>[^/]+)/items$ {
        if ($request_method = OPTIONS) { return 204; }

        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_cache jellyfin_cache;
        proxy_cache_key "PL|$pl_id|$arg_UserId|$arg_Limit|$arg_StartIndex";
        proxy_cache_revalidate off;
        proxy_cache_valid 200 12h;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 120s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;

        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, X-Emby-Authorization, Content-Type, X-Application, Range" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # === Endpoint 2: /Users/{uid}/Items/{id} (Feishin Playlist Metadata) ===
    location ~* ^/users/(?<u_uid>[^/]+)/items/(?<u_item_id>[^/]+)$ {
        if ($request_method = OPTIONS) { return 204; }

        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_cache jellyfin_cache;
        proxy_cache_key "UITEM|$u_uid|$u_item_id";
        proxy_cache_revalidate off;
        proxy_cache_valid 200 12h;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 120s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;

        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, X-Emby-Authorization, Content-Type, X-Application, Range" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # === Endpoint 3: /Items?ParentId={id} (Finamp Playlist Contents) ===
    location ~* ^/items$ {
        if ($request_method = OPTIONS) { return 204; }

        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_cache jellyfin_cache;
        proxy_cache_key "IT|$arg_ParentId|$arg_UserId|$arg_Limit|$arg_StartIndex|$arg_SortBy|$arg_SortOrder";
        proxy_no_cache $arg_SearchTerm;
        proxy_cache_bypass $arg_SearchTerm;
        proxy_cache_revalidate off;
        proxy_cache_valid 200 12h;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 120s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;

        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, X-Emby-Authorization, Content-Type, X-Application, Range" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # === Endpoint 4: /Users/{uid}/Items?ParentId=... (Generic Clients / Library Browsing) ===
    location ~* ^/users/(?<ui_uid>[^/]+)/items$ {
        if ($request_method = OPTIONS) { return 204; }

        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_cache jellyfin_cache;
        proxy_cache_key "UITEMS|$ui_uid|$arg_ParentId|$arg_Recursive|$arg_IncludeItemTypes|$arg_SortBy|$arg_SortOrder|$arg_StartIndex|$arg_Limit";
        proxy_no_cache $arg_SearchTerm;
        proxy_cache_bypass $arg_SearchTerm;
        proxy_cache_revalidate off;
        proxy_cache_valid 200 12h;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 120s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;

        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, X-Emby-Authorization, Content-Type, X-Application, Range" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # === Endpoint 5: /Artists , /Artists/AlbumArtists , /MusicGenres (Infrequently changing metadata) ===
    location ~* ^/(artists(/albumartists)?|musicgenres)$ {
        if ($request_method = OPTIONS) { return 204; }

        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_cache jellyfin_cache;
        proxy_cache_key "META|$uri|$arg_ParentId|$arg_UserId|$arg_SortBy|$arg_SortOrder|$arg_StartIndex|$arg_Limit";
        proxy_no_cache $arg_SearchTerm;
        proxy_cache_bypass $arg_SearchTerm;
        proxy_cache_revalidate off;
        proxy_cache_valid 200 12h;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 120s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;

        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, X-Emby-Authorization, Content-Type, X-Application, Range" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # === Endpoint 6: DLNA UPnP SOAP Cache (Browse / Search) ===
    # Note: DLNA uses POST SOAP requests. We cache them using URI + SOAPACTION + body.
    # We enforce Host header with server LAN IP:PORT so Jellyfin embeds reachble URIs for streaming players.
    location ~* ^/dlna/(.+)/contentdirectory/control$ {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        # Change this to your server's reachable LAN IP and port:
        proxy_set_header Host "192.168.2.251:8096";
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";

        proxy_ignore_client_abort on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_cache_methods POST;
        # Optional fallback rewriting in case Jellyfin returns 127.0.0.1 or missing port
        sub_filter "http://127.0.0.1/" "http://192.168.2.251:8096/";
        sub_filter "http://192.168.2.251/" "http://192.168.2.251:8096/";
        sub_filter_types text/xml application/xml;
        sub_filter_once off;
        client_max_body_size 512k;
        client_body_buffer_size 512k;

        proxy_cache jellyfin_cache;
        proxy_cache_key "SOAP|$uri|$http_soapaction|$request_body";
        proxy_cache_revalidate off;
        proxy_cache_valid 200 12h;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 180s;

        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;

        add_header X-Cache-Status $upstream_cache_status always;
    }

    # --- Passthrough fallback: all other endpoints (streaming, auth, websockets, images) ---
    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
